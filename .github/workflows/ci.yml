name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ${{ vars.ALMADAR_RUNNER || 'ubuntu-latest' }}
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # Not inside `build` — its trailing `|| true` swallows editor failures
      # (docs/Almadar_Extensions_Gaps.md X-2). Zed refuses the whole .lolo
      # language when highlights.scm and the pinned grammar disagree (X-1).
      - name: Check Zed extension
        run: pnpm run check:zed

      - name: Test
        run: pnpm run --if-present test

      - name: Lint
        run: pnpm exec eslint --no-warn-ignored --max-warnings 0 src/

  # validate-service disabled (service .orb schemas need fixing)
